<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أوروم · مجوهرات راقية في عمّان</title>
<meta name="description" content="Aurum is a fine jewellery house in Amman: engagement rings, wedding bands and gold jewellery made by hand.">
<meta name="theme-color" content="#070504">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' fill='%23070504'/%3E%3Ccircle cx='14' cy='16' r='9' fill='none' stroke='%23e3bd6c' stroke-width='2.6'/%3E%3Cpath d='M14 1.5 L17 5 L14 8.5 L11 5 Z' fill='%23fff0c2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://images.unsplash.com">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Manrope:wght@300;400;500;600&family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500&display=swap">
<style>
/* Layout: one continuous real-time 3D gold film behind the whole page. A ring assembles from falling drops,
   melts into liquid gold, splits into drops beside the services, pools into a rippling sphere for bridal,
   then sets again into a ring. Content floats over it. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#070504; --ivory:#f5ecdc; --mute:#b5a690; --gold:#d8b26a; --gold-hi:#f6dfa4; --line:rgba(216,178,106,.25); --glass:rgba(12,9,6,.5);
  --gg:linear-gradient(180deg,#fff0c2 0%,#e3bd6c 45%,#a8792f 55%,#f1d48e 85%,#fff3cc 100%);
  --display:"Italiana","Cormorant Garamond",serif; --it:"Cormorant Garamond",Georgia,serif; --body:"Manrope","Helvetica Neue",Arial,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);
}
:root[lang="ar"]{--display:"Amiri","Italiana",serif;--it:"Amiri",serif;--body:"Readex Pro",Tahoma,sans-serif}
*{box-sizing:border-box}
html{overflow-x:clip}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.7;overflow-x:clip;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:radial-gradient(60% 50% at 50% 45%,#2a1d0e,#070504 70%)}
main,footer{position:relative;z-index:2}
#sp{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.02;letter-spacing:.01em;text-wrap:balance}
:root[lang="ar"] h1,:root[lang="ar"] h2,:root[lang="ar"] h3{font-weight:700;line-height:1.45;letter-spacing:0}
em{font-family:var(--it);font-style:italic;font-weight:300;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline:.04em}
:root[lang="ar"] em{font-style:normal;font-weight:700;font-family:var(--display)}
em .wi{background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.gold{background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0}
a{color:inherit}
:focus-visible{outline:1px solid var(--gold-hi);outline-offset:4px}
.cap{font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-weight:500;display:inline-flex;align-items:center;gap:14px}
.cap::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
:root[lang="ar"] .cap{letter-spacing:0;font-size:.9rem}
.ltr{direction:ltr;unicode-bidi:isolate}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.14em .05em;margin:-.14em -.05em}
.wi{display:inline-block}
.split .wi{transform:translateY(115%);transition:transform 1.4s var(--out);transition-delay:calc(var(--i) * 60ms)}
.split.in .wi{transform:none}
.rise{opacity:0;transform:translateY(40px);transition:opacity 1.2s ease,transform 1.4s var(--out);transition-delay:var(--d,0s)}
.rise.in{opacity:1;transform:none}

/* splash hud */
#hud0{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(26px,env(safe-area-inset-left,0px));direction:ltr;transition:opacity .8s ease}
#hud0.gone{opacity:0}
#hud0 .r{display:flex;justify-content:space-between;align-items:flex-end;font-size:.66rem;letter-spacing:.4em;text-transform:uppercase;color:var(--mute)}
#hud0 .n{font-family:"Italiana",serif;font-size:clamp(3rem,8vw,6rem);line-height:.8;letter-spacing:0;font-variant-numeric:tabular-nums}
#hud0 .bar{height:1px;background:rgba(216,178,106,.2);margin-top:14px;position:relative}
#hud0 .bar i{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(0)}

/* cursor */
#cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:1px solid rgba(246,223,164,.7);z-index:90;pointer-events:none;display:none;transition:width .45s var(--out),height .45s var(--out),margin .45s var(--out),background .3s}
#cur.big{width:76px;height:76px;margin:-38px 0 0 -38px;background:rgba(246,223,164,.1)}
@media (pointer:fine){#cur{display:block}}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);transform:translateY(-120%);transition:transform 1s var(--out)}
body.ready header{transform:none}
body.ready header.hide{transform:translateY(-120%)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:20px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;direction:ltr}
.logo svg{width:28px;height:28px}
.logo b{font-family:"Italiana",serif;font-weight:400;font-size:1.5rem;letter-spacing:.3em}
nav{display:flex;gap:34px}
nav a{font-size:.74rem;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;opacity:.75;transition:opacity .3s,color .3s}
:root[lang="ar"] nav a{letter-spacing:0;font-size:.95rem}
nav a:hover{opacity:1;color:var(--gold-hi)}
.end{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.lang{display:inline-flex;gap:2px}
.lang button{border:0;background:none;color:var(--ivory);opacity:.5;padding:5px 7px;cursor:pointer;font-family:"Manrope","Readex Pro",sans-serif;font-size:.78rem}
.lang button[aria-pressed="true"]{opacity:1;color:var(--gold-hi)}
.btn{--mx:0px;--my:0px;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 32px;border-radius:999px;font-family:var(--body);font-size:.78rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:#1a1206;background:var(--gg);background-size:100% 220%;border:0;cursor:pointer;transform:translate(var(--mx),var(--my));transition:transform .5s var(--out),background-position .7s,box-shadow .5s;box-shadow:0 10px 40px -10px rgba(216,178,106,.55)}
:root[lang="ar"] .btn{letter-spacing:0;font-size:.95rem}
.btn:hover{background-position:0 100%;box-shadow:0 14px 50px -8px rgba(246,223,164,.75)}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ivory);box-shadow:inset 0 0 0 1px rgba(246,223,164,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.sm{padding:11px 20px;font-size:.7rem}
@media (max-width:960px){nav{display:none}.bar{grid-template-columns:auto 1fr}}
@media (max-width:460px){.end .btn{display:none}}

/* hero */
.hero{min-height:100vh;min-height:100svh;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:calc(6vh + env(safe-area-inset-bottom,0px))}
.hero .top{position:absolute;left:0;right:0;top:calc(100px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:12px;opacity:0;transition:opacity 1.4s ease .6s}
.hero .bot{display:grid;grid-template-columns:1fr auto;align-items:end;gap:28px;opacity:0;transform:translateY(30px);transition:opacity 1.4s ease .3s,transform 1.6s var(--out) .3s}
body.ready .hero .top,body.ready .hero .bot{opacity:1;transform:none}
.hero h1{font-size:clamp(3rem,8.4vw,8.6rem);max-width:11ch;letter-spacing:-.01em}
:root[lang="ar"] .hero h1{font-size:clamp(2.6rem,6.6vw,6.4rem)}
.hero .side{display:grid;gap:20px;justify-items:end;text-align:end;max-width:34ch}
.hero .side p{color:var(--mute)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.cue{display:flex;align-items:center;gap:14px;margin-top:26px;font-size:.66rem;letter-spacing:.4em;text-transform:uppercase;color:var(--mute)}
.cue i{width:70px;height:1px;background:rgba(216,178,106,.25);position:relative;overflow:hidden}
.cue i::after{content:"";position:absolute;inset:0;background:var(--gold-hi);animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media (max-width:760px){.hero .bot{grid-template-columns:1fr}.hero .side{justify-items:start;text-align:start}.hero .cta{justify-content:flex-start}}
.melt-gap{height:90vh}

/* story */
.story{min-height:120vh;display:flex;align-items:center}
.story .col{max-width:560px;display:grid;gap:28px}
:root[dir="rtl"] .story .col{margin-inline-start:0}
.story h2{font-size:clamp(2.6rem,5.6vw,5.6rem)}
.story p.lead{font-family:var(--it);font-style:italic;font-size:clamp(1.3rem,2vw,1.75rem);line-height:1.45;color:#e9dcc4}
:root[lang="ar"] .story p.lead{font-style:normal;font-family:var(--body);font-size:1.2rem;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;border-top:1px solid var(--line);padding-top:24px}
.stats b{display:block;font-family:"Italiana",serif;font-weight:400;font-size:clamp(2rem,3.4vw,3rem);line-height:1}
.stats span{color:var(--mute);font-size:.84rem}

/* services aligned with the drops */
.services{min-height:160vh;padding-block:12vh}
.services .head{display:grid;gap:18px;margin-bottom:6vh;max-width:620px}
.services h2{font-size:clamp(2.6rem,5.6vw,5.6rem)}
.slist{display:grid;gap:0;max-width:640px}
.srow{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;padding:28px 0;border-top:1px solid var(--line);align-items:baseline;position:relative}
.srow:last-child{border-bottom:1px solid var(--line)}
.srow .n{font-family:"Italiana",serif;font-size:1.1rem;color:var(--gold);direction:ltr;grid-row:span 3}
.srow h3{font-size:clamp(2rem,3.6vw,3.4rem);transition:color .4s,transform .7s var(--out)}
.srow:hover h3{color:var(--gold-hi);transform:translateX(10px)}
:root[dir="rtl"] .srow:hover h3{transform:translateX(-10px)}
.srow .tg{font-family:var(--it);font-style:italic;color:var(--mute);font-size:1.15rem}
:root[lang="ar"] .srow .tg{font-style:normal;font-family:var(--body);font-size:1rem}
.srow .items{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:.88rem;color:#d9ccb6}
.srow .items span{white-space:nowrap}
.srow .items b{font-family:"Italiana",serif;font-weight:400;color:var(--gold-hi);font-size:1.05rem;margin-inline-start:6px;direction:ltr;unicode-bidi:isolate}
.note{color:var(--mute);font-size:.8rem;margin-top:20px}
.srow{grid-template-columns:auto 1fr clamp(92px,11vw,132px)}
.srow .th{grid-column:3;grid-row:1/span 3;align-self:center;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#1a130a;box-shadow:0 0 0 1px var(--line)}
.srow .th img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--out)}
.srow:hover .th img{transform:scale(1.1)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts span{font-size:.74rem;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:#e2d4bb}
.atelier{padding-block:14vh;min-height:110vh;display:flex;flex-direction:column;justify-content:center}
.atelier .head{display:grid;gap:18px;margin-bottom:48px;max-width:640px}
.atelier h2{font-size:clamp(2.6rem,5.6vw,5.6rem)}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:640px}
.acard{padding:24px;border-radius:22px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.acard b{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1}
:root[lang="ar"] .acard b{font-weight:700;font-size:1.4rem}
.acard span{color:var(--mute);font-size:.9rem}
.acard i{font-style:normal;font-family:"Italiana",serif;color:var(--gold);font-size:.95rem;direction:ltr}
@media (max-width:560px){.agrid{grid-template-columns:1fr}.srow{grid-template-columns:auto 1fr 78px}}

/* bridal */
.bridal{min-height:150vh;display:flex;align-items:center;padding-block:14vh}
.bridal .col{margin-inline-start:auto;max-width:620px;display:grid;gap:26px}
.bridal h2{font-size:clamp(2.6rem,5.6vw,5.6rem)}
.bridal p{color:#ddd0ba;max-width:46ch}
.packs{display:grid;gap:14px}
.pack{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:22px 24px;border-radius:20px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);transition:border-color .4s,transform .6s var(--out)}
.pack:hover{border-color:var(--gold);transform:translateX(-6px)}
:root[dir="rtl"] .pack:hover{transform:translateX(6px)}
.pack h3{font-size:1.9rem}
.pack .amt{font-family:var(--body);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi);text-align:end;max-width:12ch;line-height:1.4;line-height:1;direction:ltr;unicode-bidi:isolate;grid-row:span 2;align-self:center}
.pack .amt i{font-style:normal;font-family:var(--body);font-size:.74rem;color:var(--mute);margin-inline:5px}
.pack p{font-size:.88rem;color:var(--mute)}
.brimg{aspect-ratio:16/8;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#1a130a}
.brimg img{width:100%;height:100%;object-fit:cover}
.pack.star{border-color:rgba(246,223,164,.6);background:rgba(40,28,12,.55)}

/* gallery */
.gallery{min-height:150vh;padding-block:16vh 10vh}
.gallery .head{text-align:center;display:grid;gap:18px;justify-items:center;margin-bottom:46vh}
.gallery h2{font-size:clamp(2.6rem,6vw,6rem)}
.gallery .head .cap::after{content:"";width:34px;height:1px;background:linear-gradient(270deg,transparent,var(--gold))}
.shots{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(8px,1.4vw,18px)}
.shot{aspect-ratio:3/4.4;border-radius:999px 999px 14px 14px;overflow:hidden;position:relative;background:#1a130a;box-shadow:0 0 0 1px var(--line);transform:translateY(var(--o,0));transition:transform .8s var(--out)}
.shot:nth-child(even){--o:6vh}
.shot img{width:100%;height:100%;object-fit:cover;filter:sepia(.25) saturate(.9) contrast(1.05);transition:transform 1.2s var(--out),filter .6s}
.shot:hover img{transform:scale(1.08);filter:none}
.shot span{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi);text-shadow:0 2px 10px rgba(0,0,0,.8)}
:root[lang="ar"] .shot span{letter-spacing:0;font-size:.85rem}
.gnote{text-align:center;color:var(--mute);font-size:.78rem;margin-top:10vh}
@media (max-width:820px){.shots{grid-template-columns:repeat(3,1fr)}.gallery .head{margin-bottom:30vh}}

/* reviews */
.words{min-height:90vh;display:grid;place-items:center;text-align:center;padding-block:10vh}
.words .q{font-family:var(--it);font-style:italic;font-weight:300;font-size:clamp(2rem,4.4vw,4.2rem);line-height:1.2;max-width:22ch;margin:26px auto 0;min-height:3.6em}
:root[lang="ar"] .words .q{font-style:normal;font-family:var(--display);font-weight:400;line-height:1.7;font-size:clamp(1.7rem,3.4vw,3rem)}
.words .by{display:block;margin-top:14px;color:var(--gold);font-size:.78rem;letter-spacing:.3em;text-transform:uppercase}
:root[lang="ar"] .words .by{letter-spacing:0}
.qnav{display:flex;justify-content:center;gap:10px;margin-top:24px}
.qnav button{width:34px;height:2px;border:0;background:rgba(216,178,106,.25);cursor:pointer;padding:0}
.qnav button[aria-current="true"]{background:var(--gold-hi)}
.words .note{margin-top:22px}

/* visit */
.visit{min-height:120vh;padding-block:14vh;display:flex;align-items:center}
.visit .col{max-width:640px;display:grid;gap:26px;width:100%;margin-inline-start:auto}
.visit h2{font-size:clamp(2.6rem,5.6vw,5.6rem)}
.vcard{background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,3vw,36px)}
.hrs{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-bottom:10px}
.hrs div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.hrs .today{color:var(--gold-hi)}
.hrs .off{color:var(--mute);font-style:italic}
.tiny{font-size:.78rem;color:var(--mute)}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-top:22px}
form .full{grid-column:1/-1}
label{display:grid;gap:5px;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:500}
:root[lang="ar"] label{letter-spacing:0;font-size:.85rem}
input,select,textarea{font-family:var(--body);font-size:1rem;padding:10px 0;border:0;border-bottom:1px solid rgba(216,178,106,.35);background:transparent;color:var(--ivory);width:100%;border-radius:0}
select option,select optgroup{background:#1a130a;color:var(--ivory)}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--gold-hi)}
.warn{grid-column:1/-1;font-size:.86rem;color:var(--gold-hi)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.phone{font-family:"Italiana",serif;font-size:1.6rem;direction:ltr;unicode-bidi:isolate}
@media (max-width:560px){form,.hrs{grid-template-columns:1fr}}

/* footer */
footer.site{min-height:80vh;display:flex;flex-direction:column;justify-content:flex-end}
.fword{text-align:center;font-family:"Italiana",serif;font-size:min(24vw,26rem);line-height:.85;letter-spacing:.06em;direction:ltr;background:linear-gradient(100deg,#7a5522 0%,#e3bd6c 30%,#fff3cc 40%,#e3bd6c 50%,#7a5522 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;padding-left:.06em}
@keyframes shine{to{background-position:-250% 0}}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding-block:22px calc(28px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:.8rem;border-top:1px solid var(--line)}
.replay{background:none;border:1px solid var(--line);color:var(--gold-hi);border-radius:999px;padding:7px 16px;font-family:var(--body);font-size:.76rem;cursor:pointer}
.credit a{color:inherit}

.wa{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;background:var(--gg);display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(216,178,106,.6);transform:scale(0);transition:transform .8s var(--out) .8s}
body.ready .wa{transform:none}
:root[dir="rtl"] .wa{right:auto;left:calc(18px + env(safe-area-inset-left,0px))}
.wa svg{width:26px;height:26px;fill:#1a1206}

/* phones: the gold sits behind the words, so give text a soft glass */
@media (max-width:820px){
  .story .col,.services .slist,.services .head,.bridal .col{background:rgba(7,5,4,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:22px;padding:18px}
}

/* reduced motion */
html.static #hud0,html.static #cur{display:none}
html.static header,html.static .wa,html.static .hero .top,html.static .hero .bot{transform:none;opacity:1;transition:none}
html.static .split .wi,html.static .rise{transform:none;opacity:1}
</style>
</head>
<body>


<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="sp" aria-hidden="true"></canvas>

  for(let k=0;k<want;k++){const i=(Math.random()*nv)|0;meshPts.push([pos[i*3],pos[i*3+1],pos[i*3+2],0])}
  for(let k=0;k<260;k++){const i=(Math.random()*stoneN)|0;meshPts.push([st.pos[i*3],st.pos[i*3+1],st.pos[i*3+2],1])}
  meshReady=true;
}
let meshA=reduce?1:0;
function drawMesh(t,melt,A){
  if(!mp||!meshReady||A<=.003)return;
  gl.useProgram(mp);gl.enable(gl.DEPTH_TEST);gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  const mob=innerWidth<820;
  gl.uniform2f(MU.uRes,GW,GH);gl.uniform2f(MU.uMouse,mx,my);gl.uniform3f(MU.uPos,lang==='ar'&&!mob?-PX:PX,PY,PS);gl.uniform1f(MU.uSpin,spin);gl.uniform1f(MU.uTime,t);gl.uniform1f(MU.uMelt,melt);gl.uniform1f(MU.uA,A);
  const bind=(b,loc,size,type)=>{gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,type,false,0,0)};
  gl.uniform1f(MU.uStone,0);bind(ringBuf.p,MU.aP,3,gl.FLOAT);bind(ringBuf.n,MU.aN,3,gl.FLOAT);bind(ringBuf.m,MU.aM,1,gl.FLOAT);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ringBuf.i);gl.drawElements(gl.TRIANGLES,ringN,gl.UNSIGNED_SHORT,0);
  gl.uniform1f(MU.uStone,1);bind(stoneBuf.p,MU.aP,3,gl.FLOAT);bind(stoneBuf.n,MU.aN,3,gl.FLOAT);bind(stoneBuf.m,MU.aM,1,gl.FLOAT);gl.drawArrays(gl.TRIANGLES,0,stoneN);
  [MU.aP,MU.aN,MU.aM].forEach(l=>gl.disableVertexAttribArray(l));
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
  gl.useProgram(bgProg);gl.bindBuffer(gl.ARRAY_BUFFER,bgBuf);gl.enableVertexAttribArray(bgLoc);gl.vertexAttribPointer(bgLoc,2,gl.FLOAT,false,0,0);
}
let quality=1;
function sizeGL(){if(!gl)return;const base=innerWidth<760?.5:.55,k=base*quality*Math.min(devicePixelRatio||1,1.8);GW=cv.width=Math.round(innerWidth*k);GH=cv.height=Math.round(innerHeight*k);gl.viewport(0,0,GW,GH)}

/* scroll -> film state: each section names the stage and where the gold sits */
let anchors=[];
function layout(){
  anchors=$$('[data-st]').map(el=>{const r=el.getBoundingClientRect(),y=r.top+scrollY+r.height/2-innerHeight/2;const mob=innerWidth<820,ds=el.dataset;return{y,st:+ds.st,x:mob?0:+ds.x,yy:mob?(ds.my!=null?+ds.my:+ds.y*.6):+ds.y,s:mob?(ds.ms!=null?+ds.ms:+ds.s*.78):+ds.s}}).sort((a,b)=>a.y-b.y);
}
function sample(y){
  if(!anchors.length)return{st:0,x:0,yy:0,s:1};
  if(y<=anchors[0].y)return anchors[0];
  for(let i=0;i<anchors.length-1;i++){const a=anchors[i],b=anchors[i+1];if(y<=b.y){const f=easeIO(clamp((y-a.y)/Math.max(1,b.y-a.y)));return{st:lerp(a.st,b.st,f),x:lerp(a.x,b.x,f),yy:lerp(a.yy,b.yy,f),s:lerp(a.s,b.s,f)}}}
  return anchors[anchors.length-1];
}
let S=0,PX=0,PY=.16,PS=.72,spin=0,intro=reduce?1:0,mx=0,my=0,mxT=0,myT=0;
function drawGL(t){
  if(!gl)return;
  const tg=sample(scrollY),mob=innerWidth<820;
  S+=(tg.st-S)*.07;PX+=(tg.x-PX)*.06;PY+=(tg.yy-PY)*.06;PS+=(tg.s-PS)*.06;
  spin+=.0035+Math.abs(vel)*.0006;
  gl.uniform2f(U.uRes,GW,GH);gl.uniform2f(U.uMouse,mx,my);gl.uniform1f(U.uTime,t);gl.uniform1f(U.uIntro,intro);gl.uniform1f(U.uS,clamp(S,0,5));gl.uniform1f(U.uSpin,spin);
  gl.uniform3f(U.uPos,lang==='ar'&&!mob?-PX:PX,PY,PS);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const Sc=clamp(S,0,5),melt=Sc<2.5?clamp(Sc*1.15):1-clamp((Sc-4.25)/.75);
  drawMesh(t,melt,meshA*(1-clamp((melt-.55)/.4)));
}

/* ---------- content ---------- */
let qi=0;
function splitWords(el){let i=0;const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));return}const o=document.createElement('span');o.className='w';const w=document.createElement('span');w.className='wi';w.style.setProperty('--i',i++);w.textContent=p;o.appendChild(w);f.appendChild(o)});c.replaceWith(f)}else if(c.nodeType===1)walk(c)})};walk(el);return $$('.wi',el)}
function render(){
  const t=T[lang];
  $$('[data-i]').forEach(el=>el.innerHTML=t[el.dataset.i]);
  $('f-note').placeholder=t.f_note_ph;
  const n=$('f-name');if(n.value==='Yara Nasser'||n.value==='يارا ناصر')n.value=lang==='en'?'Yara Nasser':'يارا ناصر';
  $('slist').innerHTML=t.coll.map((c,i)=>`<div class="srow rise" style="--d:${i*.06}s"><span class="n">0${i+1}</span><h3>${c[0]}</h3><p class="tg">${c[1]}</p><div class="opts">${c[2].map(o=>`<span>${o}</span>`).join('')}</div><div class="th">${IMG(COLL_IMG[i],400)}</div></div>`).join('');
  $('packs').innerHTML=t.packs.map((p,i)=>`<div class="pack rise${i===1?' star':''}" style="--d:${i*.1}s"><h3 class="gold">${p[0]}</h3><span class="amt">${t.pk_price}</span><p>${p[1]}</p></div>`).join('');
  if(!$('brimg').firstChild)$('brimg').innerHTML=IMG(BRIDAL_IMG,1200);
  $('shots').innerHTML=GAL.map((id,i)=>`<div class="shot rise" style="--d:${i*.06}s">${IMG(id,600)}<span>${t.gal[i]}</span></div>`).join('');
  $('agrid').innerHTML=t.at.map((a,i)=>`<div class="acard rise" style="--d:${i*.08}s"><i>0${i+1}</i><b class="gold">${a[0]}</b><span>${a[1]}</span></div>`).join('');
  $('qnav').innerHTML=t.quotes.map((_,i)=>`<button type="button" aria-label="${i+1}"></button>`).join('');$$('#qnav button').forEach((b,i)=>b.onclick=()=>showQ(i));showQ(qi);
  const order=[6,0,1,2,3,4,5],now=new Date();
  $('hrs').innerHTML=order.map((d,i)=>{const off=d===CLOSED_DAY,isT=now.getDay()===d;return `<div class="${isT?'today':''}"><span>${t.days[i]}</span><span class="${off?'off':''}">${off?t.closed:t.open}</span></div>`}).join('');
  const fill=(id,arr,def)=>{const s=$(id),p=s.selectedIndex<0?def:s.selectedIndex;s.innerHTML=arr.map(x=>`<option>${x}</option>`).join('');s.selectedIndex=Math.min(p,arr.length-1)};
  fill('f-service',[...t.coll.map(c=>c[0]),t.custom],0);fill('f-size',t.sizes,0);fill('f-budget',t.budgets,0);
  $$('#f-time option').forEach((o,i)=>o.textContent=t.times[i]);
  $$('.split').forEach(splitWords);
  if(document.body.classList.contains('ready'))$('heroH1').classList.add('in');
  bindHover();observe();upd();layout();
}
function showQ(i){qi=i;const q=T[lang].quotes[i];$('q').textContent='“'+q[0]+'”';$('qby').textContent=q[1];$$('#qnav button').forEach((b,k)=>b.setAttribute('aria-current',k===i))}
setInterval(()=>{const r=$('reviews').getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0)showQ((qi+1)%3)},5600);
let io;
function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -10% 0px'});$$('.split:not(#heroH1),.rise').forEach(el=>io.observe(el))}

/* ---------- cursor ---------- */
let cx=-60,cy=-60,tx=-60,ty=-60;
addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;mxT=e.clientX/innerWidth-.5;myT=e.clientY/innerHeight-.5},{passive:true});
function bindHover(){if(!fine)return;
  $$('a,button,input,select,textarea,.shot,.pack,.srow,.acard').forEach(el=>{if(el.__c)return;el.__c=1;el.addEventListener('mouseenter',()=>$('cur').classList.add('big'));el.addEventListener('mouseleave',()=>$('cur').classList.remove('big'))});
  $$('.btn').forEach(b=>{if(b.__m)return;b.__m=1;b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left-r.width/2)*.3+'px');b.style.setProperty('--my',(e.clientY-r.top-r.height/2)*.4+'px')});b.addEventListener('mouseleave',()=>{b.style.setProperty('--mx','0px');b.style.setProperty('--my','0px')})})}

/* ---------- splash: the ring gathers from its own coloured dust ---------- */
const sp=$('sp'),sx=sp.getContext('2d');let parts=[],SW=0,SH=0;
function projPt(p){
  const A=spin+mx*.5,B=-my*.3-.32,mob=innerWidth<820;let x=p[0],y=p[1],z=p[2];
  let c=Math.cos(-B),s=Math.sin(-B);[y,z]=[c*y-s*z,s*y+c*z];c=Math.cos(-A);s=Math.sin(-A);[x,z]=[c*x-s*z,s*x+c*z];
  const px=(lang==='ar'&&!mob?-PX:PX),wx=x*PS+px,wy=y*PS+PY,wz=z*PS-4.6,m=Math.min(innerWidth,innerHeight);
  return[innerWidth/2+1.62*wx/(-wz)*m,innerHeight/2-1.62*wy/(-wz)*m]}
function buildParts(){
  const dpr=Math.min(devicePixelRatio||1,2);SW=innerWidth;SH=innerHeight;sp.width=SW*dpr;sp.height=SH*dpr;sx.setTransform(dpr,0,0,dpr,0,0);
  parts=meshPts.map(p=>{const ang=Math.random()*6.283,dist=Math.max(SW,SH)*(.55+Math.random()*.7);
    return{p,sx:SW/2+Math.cos(ang)*dist,sy:SH/2+Math.sin(ang)*dist,c:p[3]?'#f4f8ff':(Math.random()<.5?'#f6dfa4':'#d8a84e'),dl:.1+Math.random()*1.1,du:1.1+Math.random()*.6,sw:(Math.random()-.5)*2,s:1+Math.random()*1.6}})}
function drawParts(s){
  sx.clearRect(0,0,SW,SH);
  const fade=1-clamp((s-2.5)/.6);if(fade<=0)return;
  sx.globalCompositeOperation='lighter';
  for(const q of parts){let k=clamp((s-q.dl)/q.du);k=1-Math.pow(2,-10*k);if(k<=.001)continue;
    const [tx,ty]=projPt(q.p),x=lerp(q.sx,tx,k)+Math.sin(k*Math.PI)*q.sw*70,y=lerp(q.sy,ty,k);
    sx.globalAlpha=(.2+.8*k)*fade;sx.fillStyle=q.c;const z=q.s*(1+(1-k)*1.4);sx.fillRect(x-z/2,y-z/2,z,z)}
  sx.globalAlpha=1;sx.globalCompositeOperation='source-over';
}
let spOn=false,spT0=0;
function playSplash(){
  if(reduce){finish();return}
  if(gl&&!meshReady){html.classList.add('locked');setTimeout(playSplash,60);return}
  scrollTo(0,0);S=0;{const a=sample(0);PX=a.x;PY=a.yy;PS=a.s}html.classList.add('locked');document.body.classList.remove('ready');$('hud0').classList.remove('gone');$('heroH1').classList.remove('in');
  intro=1;meshA=0;buildParts();spT0=performance.now();spOn=true;
}
function finish(){spOn=false;intro=1;meshA=1;sx.clearRect(0,0,SW,SH);document.body.classList.add('ready');$('hud0').classList.add('gone');html.classList.remove('locked');$('heroH1').classList.add('in')}
$('replay').onclick=playSplash;
addEventListener('click',()=>{if(spOn&&performance.now()-spT0>600)finish()});

/* ---------- loop ---------- */
let lastY=scrollY,vel=0,lastSY=scrollY,frames=0,ft0=0;
function loop(now){
  const t=now/1000;
  vel+=((scrollY-lastSY)-vel)*.15;lastSY=scrollY;
  if(spOn){const s=(now-spT0)/1000;drawParts(s);meshA=easeIO(clamp((s-2.1)/.8));const k=clamp(s/3.1);$('hudN').textContent=String(Math.round(easeIO(k)*24)).padStart(2,'0')+'k';$('hudBar').style.transform=`scaleX(${easeIO(k)})`;$('hudMsg').textContent=T[lang].hud[Math.min(2,Math.floor(k*3))];if(s>3.3)finish()}
  mx+=(mxT-mx)*.05;my+=(myT-my)*.05;
  drawGL(t);
  // adapt resolution if the device struggles
  frames++;if(!ft0)ft0=now;if(now-ft0>2000){const fps=frames*1000/(now-ft0);if(fps<32&&quality>.6){quality-=.15;sizeGL()}frames=0;ft0=now}
  const y=scrollY,h=$('hdr');if(Math.abs(y-lastY)>8){h.classList.toggle('hide',y>lastY&&y>innerHeight);lastY=y}
  if(fine){cx+=(tx-cx)*.2;cy+=(ty-cy)*.2;$('cur').style.transform=`translate(${cx}px,${cy}px)`}
  requestAnimationFrame(loop);
}

/* ---------- booking ---------- */
const ids=['f-name','f-service','f-size','f-budget','f-date','f-time','f-phone','f-note'],wa=$('waLink');
const isClosed=v=>{if(!v)return false;const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d).getDay()===CLOSED_DAY};
function upd(){const m=T[lang].msg,v=ids.map(i=>{const el=$(i);return el.tagName==='SELECT'?(el.options[el.selectedIndex]||{}).textContent||'':el.value.trim()});
  const c=isClosed($('f-date').value);$('warn').hidden=!c;wa.setAttribute('aria-disabled',c);
  let s=m[0];for(let k=0;k<7;k++)s+=`\n${m[k+1]}: ${v[k]}`;if(v[7])s+=`\n${m[8]}: ${v[7]}`;wa.href='https://wa.me/?text='+encodeURIComponent(s)}
ids.forEach(i=>{$(i).addEventListener('input',upd);$(i).addEventListener('change',upd)});
$('bookForm').addEventListener('submit',e=>e.preventDefault());
const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const d0=new Date();d0.setDate(d0.getDate()+2);if(isClosed(fmt(d0)))d0.setDate(d0.getDate()+1);$('f-date').value=fmt(d0);

function setLang(l){lang=l;html.lang=l;html.dir=l==='ar'?'rtl':'ltr';$('btn-en').setAttribute('aria-pressed',l==='en');$('btn-ar').setAttribute('aria-pressed',l==='ar');render()}
$('btn-en').onclick=()=>setLang('en');$('btn-ar').onclick=()=>setLang('ar');
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute('href').slice(1),t=$(id);if(!t)return;e.preventDefault();scrollTo({top:id==='top'?0:t.getBoundingClientRect().top+scrollY,behavior:reduce?'auto':'smooth'})});
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{sizeGL();layout()},150)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);

initGL();
setLang(location.hash==='#en'?'en':'ar');
requestAnimationFrame(loop);
playSplash();
</script>
